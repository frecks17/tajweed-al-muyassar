<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التجويد الميسر — روابط الاستماع</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f6f2e9;color:#19334c;max-width:680px;margin:50px auto;padding:20px}a{display:block;background:white;padding:15px;margin:10px 0;border-radius:12px;color:#175b77;text-decoration:none}</style><h1>التجويد الميسر</h1><p>روابط الآيات للتلاوة والتطبيق برواية حفص عن عاصم. اختر الحكم:</p><div id="links"></div><script>fetch('links.json').then(r=>r.json()).then(data=>{document.querySelector('#links').innerHTML=Object.entries(data).map(([k,v])=>'<a href="go.html?rule='+encodeURIComponent(k)+'">'+v.title+'</a>').join('')})</script></html>
