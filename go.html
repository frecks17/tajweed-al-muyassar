<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التجويد الميسر — التلاوة</title><body style="font-family:Tahoma,Arial,sans-serif;background:#f6f2e9;color:#19334c;text-align:center;padding:50px"><h2>التجويد الميسر</h2><p id="status">جارٍ فتح الآية على Quran.com…</p><a id="manual" href="index.html">العودة للفهرس</a><script>const key=new URLSearchParams(location.search).get('rule');fetch('links.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{const item=Object.prototype.hasOwnProperty.call(data,key)?data[key]:null;if(!item||!/^https:\/\/quran\.com\//.test(item.url)){document.querySelector('#status').textContent='الرابط غير متاح';return}document.querySelector('#manual').href=item.url;document.querySelector('#manual').textContent='اضغط هنا إذا لم يتم التحويل تلقائيًا';location.replace(item.url)}).catch(()=>{document.querySelector('#status').textContent='تعذر تحميل الرابط؛ حاول لاحقًا'})</script></body></html>
